<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#1a1a1a;color:#f2f2f2;font:14px/1.4 -apple-system,"Segoe UI",sans-serif}
header{padding:18px 16px;border-bottom:1px solid #3a3a3a}
header b{font-size:15px}.q{margin-top:8px;color:#bdbdbd}
.board{margin:16px;background:#121212;border:6px solid #3a3a3a;border-radius:6px;padding:8px}
.cols,.r{display:grid;grid-template-columns:40px 1fr 70px 70px;gap:6px;align-items:center}
.cols{font-size:11px;color:#9a9a9a;letter-spacing:.08em;padding:4px 2px 8px}
.r{padding:6px 2px;border-top:1px solid #2a2a2a}
.f{font:600 22px "Barlow Condensed",sans-serif;background:#222;border-radius:3px;padding:2px 6px;text-align:center;box-shadow:inset 0 -12px 0 #262626}
.f.l{text-align:left;font-size:18px}
.amber{color:#c9a227}.dim{color:#7a7a7a}
.btn{position:absolute;left:16px;right:16px;bottom:24px;height:52px;border-radius:10px;background:#f2f2f2;color:#121212;display:grid;place-items:center;font-weight:700}
</style></head><body>
<header><b>ReserBUILD</b><div class="q">Thu 5 Nov · 16:00–18:00 · 6 people</div></header>
<div class="board"><div class="cols"><span>SPACE</span><span>STATUS</span><span>CAP</span><span>PRICE</span></div>
<div class="r"><span class="f">A</span><span class="f l">FREE</span><span class="f">12</span><span class="f">350</span></div>
<div class="r"><span class="f dim">B</span><span class="f l amber">TAKEN</span><span class="f dim">12</span><span class="f dim">—</span></div>
<div class="r"><span class="f">C</span><span class="f l">FREE</span><span class="f">8</span><span class="f">350</span></div>
<div class="r"><span class="f">D</span><span class="f l">FREE</span><span class="f">20</span><span class="f">350</span></div>
</div>
<div style="margin:0 16px;color:#bdbdbd;font-size:13px">B frees at 18:00. Prices include 1 h peak at ₱200.</div>
<div class="btn">Book A · ₱350</div>
</body></html>
