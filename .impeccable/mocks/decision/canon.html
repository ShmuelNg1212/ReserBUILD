<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f9fafb;color:#111;font:15px/1.4 -apple-system,"Segoe UI",sans-serif}
header{background:#fff;padding:16px;border-bottom:1px solid #e5e7eb}
h1{font-size:18px}.f{display:flex;gap:8px;margin-top:12px}
.in{flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:10px;font-size:14px;background:#fff}
.card{margin:12px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.card small{color:#6b7280;display:block}
.b{background:#111;color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600}
.dis .b{background:#e5e7eb;color:#6b7280}
</style></head><body>
<header><h1>Book a room</h1><div class="f"><div class="in">Thu, Nov 5</div><div class="in">4:00–6:00 PM</div></div></header>
<div class="card"><div><b>Build Room A</b><small>12 people · ₱350</small></div><span class="b">Book</span></div>
<div class="card dis"><div><b>Build Room B</b><small>Unavailable</small></div><span class="b">Book</span></div>
<div class="card"><div><b>Meeting Room C</b><small>8 people · ₱350</small></div><span class="b">Book</span></div>
<div class="card"><div><b>Meeting Room D</b><small>20 people · ₱350</small></div><span class="b">Book</span></div>
</body></html>
