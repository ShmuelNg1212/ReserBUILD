<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1c1c1c;font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 10px;border-bottom:2px solid #1c1c1c}
h1{font-size:15px}.day{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.day b{font-size:22px}.day span{color:#8a8a86}
.grid{display:grid;grid-template-columns:48px repeat(4,1fr);margin:0 16px}
.hd{font-weight:700;text-align:center;padding:10px 0;border-bottom:1px solid #1c1c1c;font-size:13px}
.t{font-size:12px;color:#8a8a86;height:36px;border-bottom:1px solid #e9e9e6;padding-top:2px;font-variant-numeric:tabular-nums}
.c{height:36px;border-bottom:1px solid #e9e9e6;border-left:1px solid #e9e9e6;position:relative}
.blk{position:absolute;left:3px;right:3px;border-radius:4px;font-size:11px;padding:4px;line-height:1.2}
.taken{background:#e9e9e6;color:#8a8a86;border:1px solid #cfcfcb}
.mine{background:#1c1c1c;color:#fff}
.foot{position:absolute;left:16px;right:16px;bottom:24px;border-top:2px solid #1c1c1c;padding-top:12px}
.foot .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.btn{margin-top:12px;height:50px;border-radius:10px;background:#1c1c1c;color:#fff;display:grid;place-items:center;font-weight:600}
</style></head><body>
<header><h1>ReserBUILD</h1><div class="day"><b>Thursday 5 Nov</b><span>Tap a free block</span></div></header>
<div class="grid">
<div class="hd"></div><div class="hd">A</div><div class="hd">B</div><div class="hd">C</div><div class="hd">D</div>
<div class="t">14:00</div><div class="c"></div><div class="c"><div class="blk taken" style="top:2px;height:142px">Taken<br>14:00–18:00</div></div><div class="c"></div><div class="c"></div>
<div class="t">14:30</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"><div class="blk taken" style="top:2px;height:70px">Taken</div></div>
<div class="t">15:00</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">15:30</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">16:00</div><div class="c"><div class="blk mine" style="top:2px;height:142px">Yours<br>16:00–18:00<br>₱350</div></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">16:30</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">17:00</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">17:30</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">18:00</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="t">18:30</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
</div>
<div class="foot"><div class="row"><span>Build Room A · 2.00 h</span><b>₱350.00</b></div><div class="row" style="color:#8a8a86"><span>Pay by Wed 6 Nov 14:00</span><span>1 h peak</span></div><div class="btn">Book this block</div></div>
</body></html>
