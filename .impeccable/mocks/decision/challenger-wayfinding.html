<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390"><style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#d6d6d2;color:#1e1e1e;font:15px/1.35 -apple-system,"Segoe UI",sans-serif}
.band{background:#1e1e1e;color:#fff;padding:16px}
.band small{color:#bdbdb8}.band b{display:block;font-size:22px;margin-top:4px}
.steps{display:flex;gap:6px;padding:10px 16px;font-size:12px;color:#5c5c58}
.steps span{border-bottom:2px solid #5c5c58;padding-bottom:2px}
.gate{margin:10px 16px;background:#fff;border-radius:6px;display:grid;grid-template-columns:96px 1fr 28px;align-items:center;min-height:104px}
.n{font-size:72px;font-weight:800;text-align:center;line-height:1}
.gate b{display:block}.gate small{color:#5c5c58}
.arrow{font-size:24px}
.off{opacity:.45}
</style></head><body>
<div class="band"><small>Thu 5 Nov · 16:00–18:00 · 6 people</small><b>Pick a space</b></div>
<div class="steps"><span>1 Date ✓</span><span>2 Time ✓</span><span style="color:#1e1e1e;border-color:#1e1e1e">3 Space</span><span>4 Pay</span></div>
<div class="gate"><div class="n">A</div><div><b>Build Room A</b><small>Up to 12 · ₱350</small></div><div class="arrow">→</div></div>
<div class="gate off"><div class="n">B</div><div><b>Build Room B</b><small>Taken until 18:00</small></div><div></div></div>
<div class="gate"><div class="n">C</div><div><b>Meeting Room C</b><small>Up to 8 · ₱350</small></div><div class="arrow">→</div></div>
<div class="gate"><div class="n">D</div><div><b>Meeting Room D</b><small>Up to 20 · ₱350</small></div><div class="arrow">→</div></div>
</body></html>
